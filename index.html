<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilson Blvd &amp; N Oak St — Northeastern University</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red:    #CC0000;
    --bg:     #ffffff;
    --s1:     #f4f4f4;
    --s2:     #e8e8e8;
    --border: #dddddd;
    --white:  #ffffff;
    --gray1:  #333333;
    --gray2:  #888888;
    --green:  #22c55e;
    --r: 8px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    font-family: 'Lato', sans-serif;
    background: var(--bg);
    color: var(--white);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    height: clamp(56px, 4.5vh, 84px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 2.6vw, 34px);
    background: var(--red);
    flex-shrink: 0;
  }

  .nu-brand { display: flex; align-items: center; gap: 14px; }
  .nu-accent { width: 3px; height: clamp(22px, 2.4vh, 34px); background: rgba(255,255,255,0.4); border-radius: 2px; }

  .nu-wordmark {
    font-size: clamp(13px, 1.35vw, 18px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--white);
  }

  .topbar-right { display: flex; align-items: center; gap: 18px; }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    font-size: clamp(11px, 1.15vw, 14px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--white);
  }
  .live-dot { width: 7px; height: 7px; background: var(--white); border-radius: 50%; animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .datetime {
    font-size: clamp(12px, 1.25vw, 16px);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.85);
    font-variant-numeric: tabular-nums;
    text-transform: uppercase;
  }

  /* ── BODY (single vertical stack) ── */
  .body {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vh, 18px);
    padding: clamp(14px, 1.6vh, 20px);
    flex: 1;
    min-height: 0;
  }

  .stop-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(16px, 2vh, 26px) clamp(20px, 2.6vw, 32px);
    background: var(--white);
    flex-shrink: 0;
  }

  .stop-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

  .stop-name {
    font-size: clamp(32px, 5.4vw, 58px);
    font-weight: 300;
    letter-spacing: 0.02em;
    color: #000000;
    line-height: 1.05;
  }

  .stop-meta {
    font-size: clamp(15px, 2vw, 21px);
    font-weight: 400;
    color: var(--gray2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stop-logo {
    height: clamp(46px, 6vh, 78px);
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .stop-logo img { height: 100%; width: auto; object-fit: contain; }

  /* Buses card — this owns most of the screen */
  .buses-card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: var(--r);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .col-heads {
    display: grid;
    grid-template-columns: clamp(110px, 13vw, 150px) 1fr clamp(90px, 10vw, 130px) clamp(130px, 17vw, 190px);
    padding: clamp(10px, 1.2vh, 16px) clamp(22px, 2.8vw, 32px);
    border-bottom: 1px solid #e0e0e0;
    background: #f4f4f4;
    flex-shrink: 0;
  }
  .ch {
    font-size: clamp(10px, 1.2vw, 14px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #888888;
  }
  .ch.r { text-align: right; }
  .ch.c { text-align: center; }

  .bus-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 4px 0;
    overflow: hidden;
  }

  .bus-row {
    display: grid;
    grid-template-columns: clamp(110px, 13vw, 150px) 1fr clamp(90px, 10vw, 130px) clamp(130px, 17vw, 190px);
    align-items: center;
    padding: clamp(12px, 1.9vh, 24px) clamp(22px, 2.8vw, 32px);
    border-radius: 6px;
    margin-bottom: clamp(4px, 0.6vh, 8px);
    flex: 1;
    opacity: 0;
    animation: rowIn 0.4s ease forwards;
  }
  .bus-row:last-child { margin-bottom: 0; }
  .bus-row.group-start { margin-top: clamp(10px, 1.4vh, 18px); }

  @keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }

  .route-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: clamp(6px, 0.9vh, 10px) clamp(10px, 1.3vw, 16px);
    border-radius: 6px;
    font-size: clamp(15px, 2vw, 22px);
    font-weight: 900;
    letter-spacing: 0.02em;
    background: rgba(0,0,0,0.18);
    min-width: clamp(56px, 6vw, 78px);
  }

  .dest-wrap { display: flex; flex-direction: column; gap: 3px; }

  .dest-name {
    font-size: clamp(18px, 2.6vw, 30px);
    font-weight: 700;
    line-height: 1.1;
  }

  .dir-name {
    font-size: clamp(11px, 1.4vw, 15px);
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .trip-col { text-align: center; }
  .trip-val  { font-size: clamp(13px, 1.7vw, 18px); font-weight: 700; }
  .trip-lbl  { font-size: clamp(9px, 1.1vw, 13px); letter-spacing: 0.08em; text-transform: uppercase; }

  .arr-col { display: flex; justify-content: flex-end; }

  .arr-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: clamp(8px, 1.2vh, 14px) clamp(16px, 2vw, 24px);
    border-radius: 6px;
    min-width: clamp(100px, 12vw, 145px);
    justify-content: center;
    font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.18);
  }
  .arr-num  { font-size: clamp(26px, 4.4vw, 50px); font-weight: 900; line-height: 1; }
  .arr-unit { font-size: clamp(11px, 1.3vw, 16px); font-weight: 400; align-self: flex-end; margin-bottom: 3px; }

  .msg {
    text-align: center;
    padding: 28px;
    color: var(--gray2);
    font-size: clamp(14px, 1.8vw, 19px);
    font-style: italic;
  }
  .msg.err { color: #ff6b6b; }

  .info-card-full {
    background: var(--s1);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: var(--r);
    flex-shrink: 0;
  }

  .card-head {
    padding: clamp(10px, 1.3vh, 15px) clamp(16px, 2vw, 22px) 0;
    font-size: clamp(10px, 1.2vw, 14px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray2);
  }

  .info-body-full {
    padding: clamp(12px, 1.5vh, 18px) clamp(18px, 2.3vw, 26px);
    display: flex;
    align-items: center;
    gap: clamp(18px, 2.4vw, 32px);
  }

  .info-row { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .info-key { font-size: clamp(10px, 1.2vw, 14px); font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gray2); }
  .info-val { font-size: clamp(13px, 1.6vw, 18px); color: var(--gray1); line-height: 1.5; }

  .v-divider { width: 1px; height: clamp(28px, 4vh, 44px); background: var(--border); flex-shrink: 0; }

  .status-row {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: clamp(8px, 1.1vh, 13px) 14px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .s-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .s-dot.err { background: var(--red); }
  .s-txt { font-size: clamp(11px, 1.3vw, 15px); color: var(--gray1); }

  /* ── FOOTER ── */
  .footer {
    height: clamp(28px, 2.4vh, 40px);
    background: var(--s1);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(18px, 2.2vw, 26px);
    flex-shrink: 0;
  }
  .ft { font-size: clamp(10px, 1.15vw, 14px); color: var(--gray2); letter-spacing: 0.04em; }

  .red-rule { height: 3px; background: var(--red); flex-shrink: 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="nu-brand">
    <div class="nu-accent"></div>
    <div class="nu-wordmark">Northeastern University</div>
  </div>
  <div class="topbar-right">
    <div class="datetime" id="dateTime">—</div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
  </div>
</div>

<div class="body">

  <div class="stop-row">
    <div class="stop-left">
      <div class="stop-name">Wilson Blvd &amp; N Oak St</div>
      <div class="stop-meta">Next arriving bus</div>
    </div>
    <div class="stop-logo">
      <img src="wmata-logo.png" alt="WMATA logo">
    </div>
  </div>

  <div class="buses-card">
    <div class="col-heads">
      <div class="ch">Route</div>
      <div class="ch">Destination</div>
      <div class="ch c">Trip</div>
      <div class="ch r">Arrives</div>
    </div>
    <div class="bus-list" id="busList">
      <div class="msg">Loading bus data…</div>
    </div>
  </div>

  <div class="card info-card-full">
    <div class="card-head">Stop Info</div>
    <div class="info-body-full">
      <div class="info-row">
        <div class="info-key">Stop ID</div>
        <div class="info-val">6000702</div>
      </div>
      <div class="v-divider"></div>
      <div class="info-row">
        <div class="info-key">Location</div>
        <div class="info-val">Wilson Blvd &amp; N Oak St, Arlington, VA</div>
      </div>
      <div class="v-divider"></div>
      <div class="status-row">
        <div class="s-dot" id="sDot"></div>
        <div class="s-txt" id="sTxt">Checking status…</div>
      </div>
    </div>
  </div>

</div>

<div class="footer">
  <div class="ft">WMATA Real-Time Data · Stop 6000702</div>
  <div class="ft" id="lastUpdated">Last updated: —</div>
</div>
<div class="red-rule"></div>

<script>
  const API_KEY = '9c43549bb06640adb9681598edeaf056';
  const BUS_STOP_ID = '6000702';
  const MAX_ROWS = 8;
  const TIME_ZONE = 'America/New_York';

  // Rotating palette used to color-code routes for at-a-glance grouping,
  // since Metrobus routes don't have an official per-route color system
  // the way Metrorail lines do.
  const ROUTE_PALETTE = ['#0073e6', '#CC0000', '#009639', '#6e7275', '#ff6600', '#7c3aed', '#0891b2', '#b45309'];
  const routeColorCache = {};
  function colorForRoute(route) {
    if (!routeColorCache[route]) {
      const keys = Object.keys(routeColorCache).length;
      routeColorCache[route] = ROUTE_PALETTE[keys % ROUTE_PALETTE.length];
    }
    return routeColorCache[route];
  }

  function setStatus(ok, msg) {
    document.getElementById('sDot').className = 's-dot' + (ok ? '' : ' err');
    document.getElementById('sTxt').textContent = msg;
  }

  function updateDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: TIME_ZONE });
    const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: TIME_ZONE });
    document.getElementById('dateTime').textContent = `${date} · ${time}`;
  }

  function formatArrival(minutes) {
    if (minutes === null || minutes === undefined || minutes === '') return { val: '—', unit: false };
    if (minutes === '0' || minutes === 0) return { val: 'ARR', unit: false };
    return { val: minutes, unit: true };
  }

  function render(predictions) {
    const el = document.getElementById('busList');
    if (!predictions?.length) { el.innerHTML = '<div class="msg err">No predictions available</div>'; return; }
    const valid = predictions.filter(p => p && p.RouteID);
    if (!valid.length) { el.innerHTML = '<div class="msg err">No valid bus data</div>'; return; }

    // Group by route, preserving arrival order within each route
    const groups = {};
    valid.forEach(p => { (groups[p.RouteID] = groups[p.RouteID] || []).push(p); });
    const grouped = [];
    Object.keys(groups).forEach(route => grouped.push(...groups[route]));

    const rows = grouped.slice(0, MAX_ROWS);

    el.innerHTML = rows.map((b, i) => {
      const bg = colorForRoute(b.RouteID);
      const fg = '#ffffff';
      const fgMuted = 'rgba(255,255,255,0.7)';
      const dest = b.DirectionText || 'Unknown destination';
      const dirLabel = b.DirectionNum === '0' ? 'Inbound' : b.DirectionNum === '1' ? 'Outbound' : '';
      const trip = b.TripID ? b.TripID.slice(-4) : '—';
      const arr = formatArrival(b.Minutes);
      const isNewGroup = i > 0 && rows[i - 1].RouteID !== b.RouteID;
      return `
      <div class="bus-row${isNewGroup ? ' group-start' : ''}" style="background:${bg};animation-delay:${i * 0.05}s">
        <div class="route-tag" style="color:${fg}">${b.RouteID || '?'}</div>
        <div class="dest-wrap">
          <div class="dest-name" style="color:${fg}">${dest}</div>
          ${dirLabel ? `<div class="dir-name" style="color:${fgMuted}">${dirLabel}</div>` : ''}
        </div>
        <div class="trip-col">
          <div class="trip-val" style="color:${fg}">${trip}</div>
          <div class="trip-lbl" style="color:${fgMuted}">trip</div>
        </div>
        <div class="arr-col">
          <div class="arr-chip" style="color:${fg}">
            <span class="arr-num">${arr.val}</span>
            ${arr.unit ? `<span class="arr-unit" style="color:${fgMuted}">min</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  async function refresh() {
    try {
      const res = await fetch(`https://api.wmata.com/NextBusService.svc/json/jPredictions?StopID=${BUS_STOP_ID}&api_key=${API_KEY}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      render(data.Predictions);
      setStatus(true, 'Normal Operations');
      document.getElementById('lastUpdated').textContent =
        'Last updated: ' + new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TIME_ZONE });
    } catch (e) {
      document.getElementById('busList').innerHTML = `<div class="msg err">Connection error — ${e.message}</div>`;
      setStatus(false, 'Data unavailable');
    }
  }

  updateDateTime();
  setInterval(updateDateTime, 1000);
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
